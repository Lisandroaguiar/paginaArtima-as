<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obras - Carrusel</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/obras.css">
</head>
<body class="obras-page">
    <main class="carousel-container">
        <h1 id="category-title" class="category-title"></h1>
        
        <div class="carousel-wrapper">
            <button class="carousel-nav prev" id="prevBtn">‹</button>
            <div class="carousel-track" id="carouselTrack"></div>
            <button class="carousel-nav next" id="nextBtn">›</button>
        </div>

        <div class="color-bar">
            <div class="color-segment memoria"></div>
            <div class="color-segment percepcion"></div>
            <div class="color-circle" id="colorIndicator"></div>
            <div class="color-segment conciencia"></div>
            <div class="color-segment cuerpo"></div>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/obras.js"></script>
</body>
</html>
