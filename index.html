      <script>
        // --- CONFIGURACIÓN ---
        // 1. Establece la fecha y hora de destino (Año, Mes (0-11), Día, Hora, Minuto, Segundo)
        // Ejemplo: 29 de Noviembre de 2026 a las 19:00:00
        const countdownDate = new Date("November 29, 2025 19:00:00").getTime();
        
        // Elementos del DOM
        const modalOverlay = document.getElementById('countdown-modal-overlay');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const daysEl = document.getElementById('countdown-days');
        const hoursEl = document.getElementById('countdown-hours');
        const minutesEl = document.getElementById('countdown-minutes');
        const secondsEl = document.getElementById('countdown-seconds');

        // Función para mostrar el modal
        function showModal() {
            modalOverlay.classList.remove('hidden'); // Aseguramos que es visible
            // Aplicamos la clase de entrada para la transición (el CSS maneja el resto)
            modalOverlay.classList.add('modal-transition-enter-active');
        }

        // Función para ocultar el modal
        function hideModal() {
            // Aplicamos la clase de salida para la transición
            modalOverlay.classList.remove('modal-transition-enter-active');
            modalOverlay.classList.add('modal-transition-leave-active');

            // Ocultar el elemento completamente después de la transición
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
            }, 300); // 300ms es la duración de la transición en CSS
        }

        // Función para formatear el número con dos dígitos (ej: 5 -> 05)
        function formatTime(time) {
            return time < 10 ? `0${time}` : time;
        }

        // Función principal de la cuenta regresiva
        function startCountdown() {
            const now = new Date().getTime();
            const distance = countdownDate - now;

            // Cálculos de tiempo
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            if (distance < 0) {
                // Si la cuenta regresiva ha terminado
                clearInterval(interval);
                daysEl.textContent = '00';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';
                // Opcional: Mostrar mensaje de "Evento en curso" en el modal
                document.querySelector('h2').textContent = "¡El evento ha comenzado!";
                return;
            }

            // Actualizar el DOM
            daysEl.textContent = formatTime(days);
            hoursEl.textContent = formatTime(hours);
            minutesEl.textContent = formatTime(minutes);
            secondsEl.textContent = formatTime(seconds);
        }

        // --- INICIALIZACIÓN ---

        // 1. Iniciar la cuenta regresiva
        // Ejecutar inmediatamente y luego cada segundo
        startCountdown();
        const interval = setInterval(startCountdown, 1000);

        // 2. Mostrar el modal al cargar la página
        window.onload = function() {
            // Inicialmente, añadimos 'hidden' para que no se vea antes del JS.
            // Lo quitamos aquí solo si quieres que aparezca inmediatamente.
            // Para la transición, es mejor que inicialmente tenga la opacidad 0 (modal-transition-enter).
            showModal();
        };

        // 3. Configurar el evento para cerrar el modal
        closeModalBtn.addEventListener('click', hideModal);

        // Opcional: Cerrar el modal haciendo clic en el fondo
        modalOverlay.addEventListener('click', (e) => {
            // Solo cerramos si se hace clic directamente en el overlay y no en el modal en sí
            if (e.target === modalOverlay) {
                hideModal();
            }
        });

    </script>
