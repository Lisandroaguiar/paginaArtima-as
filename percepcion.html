<section class="slider-section">

    <div class="carousel-container">
        <div class="carousel">

            <!-- CARD 1 -->
            <div class="card">
                <div class="card-inner">
                    <img src="https://picsum.photos/300/300?random=1">
                    <p>Pepito Gonzales</p>
                </div>
            </div>

            <!-- CARD 2 -->
            <div class="card">
                <div class="card-inner">
                    <img src="https://picsum.photos/300/300?random=2">
                    <p>Pepito Gonzales</p>
                </div>
            </div>

            <!-- CARD 3 -->
            <div class="card">
                <div class="card-inner">
                    <img src="https://picsum.photos/300/300?random=3">
                    <p>Pepito Gonzales</p>
                </div>
            </div>

            <!-- CARD 4 -->
            <div class="card">
                <div class="card-inner">
                    <img src="https://picsum.photos/300/300?random=4">

            </div>

            <!-- CARD 5 -->

                </div>
            </div>

        </div>
    </div>

    <!-- BARRA DE PROGRESO CON 6 PUNTOS -->
    <div class="progress-wrapper">

        <input type="range" id="progressRange" min="0" max="100" value="0" step="0.1" class="progress-range">

        <div class="progress-dots">
            <span class="dot" style="left: 0%;"></span>
            <span class="dot" style="left: 20%;"></span>
            <span class="dot" style="left: 40%;"></span>
            <span class="dot" style="left: 60%;"></span>
            <span class="dot" style="left: 80%;"></span>
            <span class="dot" style="left: 100%;"></span>
        </div>

    </div>
